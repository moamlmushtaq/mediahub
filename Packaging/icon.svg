<?xml version="1.0" encoding="UTF-8"?>
<!--
  ميديا هَب — the macOS icon.

  WHY THIS IS NOT JUST THE iOS ICON

  iOS icons are full-bleed squares; the system rounds them for you. macOS icons
  are the opposite: the app ships the shape, and the platform expects a rounded
  rectangle floating inside a 1024 canvas with clear margin around it. Handing
  Finder the iOS square gives you a hard-edged tile in a dock of soft ones, and
  it is the single most reliable way to make an app look like it was ported by
  someone who did not care.

  Apple's grid: an 824 x 824 rounded rect centred in 1024, corner radius ~185.
  The margin is not wasted space — it is where the shadow lives, and it is what
  keeps every icon in the dock optically the same size.

  The artwork inside is the same mark as the phone and the website, scaled by
  824/1024 so it sits at exactly the same proportion within its shape. Same
  product, three places.

  (XML forbids a double hyphen inside a comment; use an em dash.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="ground" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1a1715"/>
      <stop offset="62%" stop-color="#100e0c"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </radialGradient>

    <linearGradient id="metal" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e2c179"/>
      <stop offset="55%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#a8853a"/>
    </linearGradient>

    <linearGradient id="ringMetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e2c179"/>
      <stop offset="50%" stop-color="#9a7c38"/>
      <stop offset="100%" stop-color="#c9a24d"/>
    </linearGradient>

    <clipPath id="shape">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>

    <!-- A dark icon on a dark dock needs this to sit on the surface rather than
         be cut out of it. Offset downward because light comes from above. -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- The shape, and its shadow. Drawn opaque first so the blur has something
       solid to cast from. -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185"
        fill="#0b0a09" filter="url(#drop)"/>

  <g clip-path="url(#shape)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ground)"/>

    <!-- The mark, at the same proportion it holds on the phone. -->
    <g transform="translate(100 100) scale(0.8047)">
      <g fill="none" stroke="url(#ringMetal)" stroke-width="44" stroke-linecap="round">
        <path d="M 512 186 A 326 326 0 0 1 838 512"/>
        <path d="M 838 512 A 326 326 0 0 1 512 838"/>
        <path d="M 512 838 A 326 326 0 0 1 186 512"/>
        <path d="M 186 512 A 326 326 0 0 1 512 186"/>
      </g>
      <path d="M 428 372 L 662 512 L 428 652 Z"
            fill="url(#metal)" stroke="url(#metal)" stroke-width="56"
            stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- A single lit pixel along the top edge. Reads as glass; costs nothing. -->
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185"
          fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>
</svg>
